<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.52" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>

    <radialGradient id="silverGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(410 155) rotate(20) scale(430 240)">
      <stop stop-color="#D8D8D8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#D8D8D8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1260 225) rotate(-20) scale(330 210)">
      <stop stop-color="#36D399" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#36D399" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="silverLine" x1="120" y1="80" x2="1450" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="0.32" stop-color="#D5D5D5" stop-opacity="0.22"/>
      <stop offset="0.68" stop-color="#BDBDBD" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="greenLine" x1="1020" y1="50" x2="1450" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36D399" stop-opacity="0.02"/>
      <stop offset="0.5" stop-color="#36D399" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#36D399" stop-opacity="0.01"/>
    </linearGradient>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>

    <filter id="blur">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>

  <ellipse cx="410" cy="155" rx="330" ry="185" fill="url(#silverGlow)" filter="url(#blur)"/>
  <ellipse cx="1260" cy="225" rx="250" ry="160" fill="url(#emeraldGlow)" filter="url(#blur)"/>

  <!-- architectural frame -->
  <path d="M68 82H250M68 82V200" stroke="#FFFFFF" stroke-opacity="0.11"/>
  <path d="M1532 338H1350M1532 338V220" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect x="52" y="34" width="1496" height="352" rx="20" stroke="#FFFFFF" stroke-opacity="0.035"/>

  <!-- system paths -->
  <path d="M-90 304C164 190 348 114 590 126C813 137 1008 237 1273 221C1422 212 1531 164 1688 69"
        stroke="url(#silverLine)" stroke-width="1.6"/>
  <path d="M-35 345C211 262 405 213 625 219C847 226 1018 295 1277 290C1427 287 1533 255 1650 200"
        stroke="url(#silverLine)" stroke-width="0.85"/>
  <path d="M1035 39C1160 79 1262 142 1305 224C1344 298 1327 353 1291 401"
        stroke="url(#greenLine)" stroke-width="1.35"/>
  <path d="M318 28C220 83 168 147 154 220C143 279 157 333 190 388"
        stroke="url(#silverLine)" stroke-width="0.9"/>

  <!-- sparse system nodes -->
  <circle cx="590" cy="126" r="3.2" fill="#D8D8D8"/>
  <circle cx="1273" cy="221" r="2.8" fill="#C8C8C8"/>
  <circle cx="1305" cy="224" r="3.1" fill="#36D399"/>
  <circle cx="154" cy="220" r="2.5" fill="#C8C8C8"/>

  <!-- micro-detail -->
  <text x="84" y="230" fill="#787878" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2.4">
    SYSTEMS / PRODUCT / LEVERAGE
  </text>
  <text x="1516" y="195" text-anchor="end" fill="#626262" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="2.2">
    BUILD WITH INTENT
  </text>

  <!-- identity -->
  <text x="800" y="183" text-anchor="middle" fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="5">
    AHMAD AKHTAR
  </text>
  <text x="800" y="228" text-anchor="middle" fill="#C0C0C0"
        font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" letter-spacing="2">
    Tech × Business | Product × Growth
  </text>
</svg>